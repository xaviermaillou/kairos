databaseChangeLog:
  - changeSet:
      id: 1-create-users
      author: kairos
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: contact_email
                  type: VARCHAR(320)
                  constraints:
                    nullable: false
                    unique: true
