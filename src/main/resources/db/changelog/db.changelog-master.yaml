databaseChangeLog:
  - changeSet:
      id: 1-create-users
      author: kairos
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: contact_email
                  type: VARCHAR(320)
                  constraints:
                    nullable: false
                    unique: true
  - changeSet:
      id: 2-create-applications
      author: kairos
      changes:
        - createTable:
            tableName: applications
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_applications_user
                    references: users(id)
              - column:
                  name: job_offer_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: sent_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: channel
                  type: VARCHAR(100)
              - column:
                  name: status
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: offer_title
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: offer_company_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: offer_content
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: offer_location
                  type: VARCHAR(255)
              - column:
                  name: offer_country
                  type: VARCHAR(100)
              - column:
                  name: offer_work_arrangement
                  type: VARCHAR(100)
  - changeSet:
      id: 3-share-job-offer-snapshots
      author: kairos
      changes:
        - createTable:
            tableName: job_offers
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: company_id
                  type: UUID
                  constraints:
                    nullable: false
        - createTable:
            tableName: job_offer_snapshots
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: job_offer_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_job_offer_snapshots_offer
                    references: job_offers(id)
              - column:
                  name: title
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: company_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: content
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: location
                  type: VARCHAR(255)
              - column:
                  name: country
                  type: VARCHAR(100)
              - column:
                  name: work_arrangement
                  type: VARCHAR(100)
              - column:
                  name: captured_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - addColumn:
            tableName: applications
            columns:
              - column:
                  name: job_offer_snapshot_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_applications_offer_snapshot
                    references: job_offer_snapshots(id)
        - dropColumn:
            tableName: applications
            columnName: job_offer_id
        - dropColumn:
            tableName: applications
            columnName: offer_title
        - dropColumn:
            tableName: applications
            columnName: offer_company_name
        - dropColumn:
            tableName: applications
            columnName: offer_content
        - dropColumn:
            tableName: applications
            columnName: offer_location
        - dropColumn:
            tableName: applications
            columnName: offer_country
        - dropColumn:
            tableName: applications
            columnName: offer_work_arrangement
  - changeSet:
      id: 4-create-companies
      author: kairos
      changes:
        - createTable:
            tableName: companies
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: website
                  type: VARCHAR(2048)
        - addForeignKeyConstraint:
            constraintName: fk_job_offers_company
            baseTableName: job_offers
            baseColumnNames: company_id
            referencedTableName: companies
            referencedColumnNames: id
  - changeSet:
      id: 5-create-application-steps
      author: kairos
      changes:
        - createTable:
            tableName: application_steps
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: application_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_application_steps_application
                    references: applications(id)
              - column:
                  name: type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: position_index
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: objective
                  type: TEXT
              - column:
                  name: format
                  type: VARCHAR(100)
              - column:
                  name: scheduled_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: participants
                  type: TEXT[]
              - column:
                  name: practical_information
                  type: TEXT
              - column:
                  name: preparation_notes
                  type: TEXT
              - column:
                  name: debrief
                  type: TEXT
              - column:
                  name: status
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: application_steps
            columnNames: application_id, position_index
            constraintName: uq_application_steps_position
  - changeSet:
      id: 6-record-application-events
      author: kairos
      changes:
        - addColumn:
            tableName: applications
            columns:
              - column:
                  name: result
                  type: VARCHAR(32)
        - update:
            tableName: applications
            columns:
              - column:
                  name: status
                  value: ONGOING
            where: status = 'INTERVIEWING'
        - update:
            tableName: applications
            columns:
              - column:
                  name: status
                  value: ARCHIVED
            where: status = 'CLOSED'
        - createTable:
            tableName: application_events
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: application_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_application_events_application
                    references: applications(id)
              - column:
                  name: actor_user_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_application_events_actor
                    references: users(id)
              - column:
                  name: change_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: change_payload
                  type: JSONB
                  constraints:
                    nullable: false
              - column:
                  name: occurred_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: suggestion_id
                  type: UUID
        - createIndex:
            tableName: application_events
            indexName: idx_application_events_application_time
            columns:
              - column:
                  name: application_id
              - column:
                  name: occurred_at
  - changeSet:
      id: 7-store-step-participants-as-json
      author: kairos
      changes:
        - sql:
            sql: >-
              ALTER TABLE application_steps
              ALTER COLUMN participants TYPE JSONB
              USING to_jsonb(participants)
  - changeSet:
      id: 8-add-application-event-lifecycle
      author: kairos
      changes:
        - renameColumn:
            tableName: application_events
            oldColumnName: occurred_at
            newColumnName: created_at
            columnDataType: TIMESTAMP WITH TIME ZONE
        - dropColumn:
            tableName: application_events
            columnName: suggestion_id
        - addColumn:
            tableName: application_events
            columns:
              - column:
                  name: status
                  type: VARCHAR(32)
                  defaultValue: APPLIED
                  constraints:
                    nullable: false
              - column:
                  name: decided_at
                  type: TIMESTAMP WITH TIME ZONE
        - update:
            tableName: application_events
            columns:
              - column:
                  name: decided_at
                  valueComputed: created_at
