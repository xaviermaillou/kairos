databaseChangeLog:
  - changeSet:
      id: 1-create-users
      author: kairos
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: contact_email
                  type: VARCHAR(320)
                  constraints:
                    nullable: false
                    unique: true
  - changeSet:
      id: 2-create-applications
      author: kairos
      changes:
        - createTable:
            tableName: applications
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_applications_user
                    references: users(id)
              - column:
                  name: job_offer_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: sent_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: channel
                  type: VARCHAR(100)
              - column:
                  name: status
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: offer_title
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: offer_company_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: offer_content
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: offer_location
                  type: VARCHAR(255)
              - column:
                  name: offer_country
                  type: VARCHAR(100)
              - column:
                  name: offer_work_arrangement
                  type: VARCHAR(100)
